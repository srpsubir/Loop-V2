  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

;\n  src: url(\"ec6a35cf-dc98-45f1-8508-eab21dab0157\") format(\"woff2\");\n}\n@font-face {\n  font-family: \"Lora\";\n  font-style: italic;\n  font-weight: 500;\n  font-display: swap;\n  src: url(\"205cbf83-8ac9-49ce-be7d-22635c83a5f1\") format(\"woff2\");\n}\n<\u002Fstyle>\n  <style>/* Loop — color tokens\n   Warm parchment palette. Paper, not boxes. Never pure white, never pure black.\n   Base values first, then semantic aliases. Use the aliases in components. */\n\n:root {\n  /* ---- Base palette ---------------------------------------------------- */\n\n  /* Parchment / surfaces — the paper the whole app is printed on */\n  --parchment-bg:        #F9F5EE; /* app background */\n  --parchment-surface:   #EFE6D6; /* resting surface */\n  --parchment-raised:    #E8DBCA; /* raised surface / hover well */\n\n  /* Terracotta — the primary warm accent (ink stamp, not a button factory) */\n  --terracotta:          #B8624A;\n  --terracotta-light:    #D4856E;\n  --terracotta-faint:    #F5EAD8;\n\n  /* Dusty rose — secondary warmth, people & relationships */\n  --rose:                #C49A8A;\n  --rose-faint:          #F7EDE8;\n\n  /* Sage — quiet positive / growth / \"still close\" */\n  --sage:                #6A9470;\n  --sage-faint:          #EAF2EB;\n\n  /* Ink — text browns, never black */\n  --ink:                 #2A1F1B; /* primary text */\n  --ink-mid:             #6B5447; /* secondary text */\n  --ink-muted:           #A38F85; /* metadata, captions, placeholders */\n\n  /* Hairlines */\n  --line:                #DDD0C0; /* standard border */\n  --line-light:          #EDE3D5; /* faint divider */\n\n  /* ---- Semantic aliases ------------------------------------------------ */\n\n  --bg:                  var(--parchment-bg);\n  --surface:             var(--parchment-surface);\n  --surface-raised:      var(--parchment-raised);\n\n  --text-primary:        var(--ink);\n  --text-secondary:      var(--ink-mid);\n  --text-muted:          var(--ink-muted);\n  --text-on-accent:      var(--parchment-bg);\n\n  --accent:              var(--terracotta);\n  --accent-hover:        #A6543E;        /* terracotta, pressed darker */\n  --accent-light:        var(--terracotta-light);\n  --accent-faint:        var(--terracotta-faint);\n\n  --people:              var(--rose);\n  --people-faint:        var(--rose-faint);\n\n  --positive:            var(--sage);\n  --positive-faint:      var(--sage-faint);\n\n  --border:              var(--line);\n  --border-light:        var(--line-light);\n\n  /* Focus ring — terracotta at low opacity, soft and warm */\n  --focus-ring:          0 0 0 3px rgba(184, 98, 74, 0.28);\n\n  /* Selection */\n  --selection-bg:        rgba(184, 98, 74, 0.18);\n}\n\n::selection {\n  background: var(--selection-bg);\n  color: var(--text-primary);\n}\n<\u002Fstyle>\n  <style>/* Loop — typography tokens\n   Lora (serif) for names, chapter titles, hero & emotional moments.\n   Inter (sans) for everything functional: body, labels, metadata.\n   Type wants air — generous line-height, gentle tracking on caps. */\n\n:root {\n  /* Families */\n  --font-serif: \"Lora\", Georgia, \"Times New Roman\", serif;\n  --font-sans:  \"Inter\", -apple-system, BlinkMacSystemFont, \"Segoe UI\", sans-serif;\n\n  /* Weights */\n  --weight-regular: 400;\n  --weight-medium:  500;\n  --weight-semibold: 600;\n  --weight-bold:    700;\n\n  /* Type scale (px) — desktop app at ~1200x800 */\n  --text-display: 40px; /* hero chapter title */\n  --text-h1:      30px; /* screen / chapter heading (serif) */\n  --text-h2:      22px; /* section heading (serif) */\n  --text-h3:      18px; /* person name, card title */\n  --text-body:    15px; /* default body */\n  --text-sm:      13px; /* secondary, controls */\n  --text-xs:      12px; /* metadata, captions */\n  --text-micro:   11px; /* eyebrow / overline */\n\n  /* Line heights */\n  --leading-tight:   1.15; /* large serif headings */\n  --leading-snug:    1.3;  /* titles */\n  --leading-normal:  1.55; /* body adii — soft, never sharp, never pill-everything.\n     Paper corners are gently rounded. */\n  --radius-xs:  4px;\n  --radius-sm:  8px;\n  --radius-md:  12px;  /* default surface / well */\n  --radius-lg:  18px;  /* photo frames, large surfaces */\n  --radius-xl:  28px;\n  --radius-full: 999px; /* avatars, chips */\n\n  /* Control sizing */\n  --control-height-sm: 30px;\n  --control-height-md: 38px;\n  --control-height-lg: 46px;\n\n  /* Layout */\n  --app-min-width: 1024px;\n  --content-max:   720px; /* comfortable reading measure for memory text */\n}\n\n/* Loop — elevation & effects\n   Shadows are warm-tinted (brown, never neutral grey) and soft.\n   We lift paper with light, not with borders. Cards = shadow, not stroke. */\n\n:root {\n  /* Warm shadow ink — derived from --ink, applied at low alpha */\n\n  /* Resting paper: barely there, just enough to separate from background */\n  --shadow-sm:\n    0 1px 2px rgba(42, 31, 27, 0.05),\n    0 1px 3px rgba(42, 31, 27, 0.04);\n\n  /* Default card / raised surface */\n  --shadow-md:\n    0 1px 2px rgba(42, 31, 27, 0.05),\n    0 4px 12px rgba(42, 31, 27, 0.07);\n\n  /* Lifted: hovered card, popover */\n  --shadow-lg:\n    0 2px 4px rgba(42, 31, 27, 0.06),\n    0 12px 28px rgba(42, 31, 27, 0.10);\n\n  /* Floating: dialogs, dragged photo */\n  --shadow-xl:\n    0 8px 16px rgba(42, 31, 27, 0.08),\n    0 28px 60px rgba(42, 31, 27, 0.16);\n\n  /* Inset well — pressed pockets, search fields sunk into paper */\n  --shadow-inset:\n    inset 0 1px 2px rgba(42, 31, 27, 0.08);\n\n  /* Photo frame — a slightly stronger, warmer drop for imagery */\n  --shadow-photo:\n    0 2px 6px rgba(42, 31, 27, 0.10),\n    0 16px 32px rgba(42, 31, 27, 0.14);\n\n  /* Motion — gentle, never bouncy. Memories settle, they don't snap. */\n  --ease-out: cubic-bezier(0.22, 0.61, 0.36, 1); /* @kind other */\n  --ease-in-out: cubic-bezier(0.45, 0, 0.2, 1); /* @kind other */\n  --duration-fast: 120ms; /* @kind other */\n  --duration-base: 200ms; /* @kind other */\n  --duration-slow: 320ms; /* @kind other */\n}\n\n<\u002Fstyle>\n  <script src=\"c74149c7-024d-4e82-a34c-74a73db82c02\"><\u002Fscript>\n  <style>\n    html, body { margin:0; height:100%; }\n    body { background:#E2D6C2; display:flex; align-items:center; justify-content:center; min-height:100vh; padding:36px; box-sizing:border-box; -webkit-font-smoothing:antialiased; font-family:\"Inter\",sans-serif; }\n  <\u002Fstyle>\n<\u002Fhelmet>\n\n\n\n<div style=\"width:1200px; height:800px; background:var(--bg); border-radius:16px; overflow:hidden; box-shadow:0 8px 16px rgba(42,31,27,.10),0 40px 90px rgba(42,31,27,.30); display:flex; flex-direction:column; position:relative;\">\n\n  <!-- titlebar -->\n  <div style=\"height:48px; flex:none; background:var(--surface-raised); display:flex; align-items:center; gap:8px; padding:0 20px; border-bottom:1px solid var(--border);\">\n    <div style=\"width:12px; height:12px; border-radius:50%; background:#ED6A5E;\"><\u002Fdiv>\n    <div style=\"width:12px; height:12px; border-radius:50%; background:#F4BF4F;\"><\u002Fdiv>\n    <div style=\"width:12px; height:12px; border-radius:50%; background:#61C554;\"><\u002Fdiv>\n  <\u002Fdiv>\n\n  <div style=\"flex:1; display:flex; min-height:0;\">\n\n    <!-- sidebar -->\n    <aside style=\"width:228px; flex:none; background:var(--surface); border-right:1px solid var(--border); display:flex; flex-direction:column; padding:26px 18px;\">\n      <div style=\"display:flex; align-items:center; gap:10px; padding:2px 8px 28px;\">\n        <img src=\"505cca7d-ea85-4aa4-aec9-564c58fd74e3\" alt=\"\" style=\"width:26px; height:26px;\">\n        <span style=\"font-family:'Lora',serif; font-size:22px; font-weight:600; color:var(--text-primary);\">Loop<\u002Fspan>\n      <\u002Fdiv>\n      <div style=\"display:flex; align-items:center; gap:12px; padding:10px 12px; border-radius:10px; background:var(--surface-raised); color:var(--text-primary); font-size:14px; font-weight:600;\"><span style=\"width:6px; height:6px; border-radius:50%; background:var(--accent);\"><\u002Fspan>Home<\u002Fdiv>\n      <div style=\"display:flex; align-items:center; gap:12px; padding:10px 12px; border-radius:10px; color:var(--text-secondary); font-size:14px;\"><span style=\"width:6px; height:6px; border-radius:50%; background:#C9BBA9;\"><\u002Fspan>People<\u002Fdiv>\n      <div style=\"display:flex; align-items:center; gap:12px; padding:10px 12px; border-radius:10px; color:var(--text-secondary); font-size:14px;\"><span style=\"width:6px; height:6px; border-radius:50%; background:#C9BBA9;\"><\u002Fspan>Chapters<\u002Fdiv>\n      <div style=\"display:flex; align-items:center; gap:12px; padding:10px 12px; border-radius:10px; color:var(--text-secondary); font-size:14px;\"><span style=\"width:6px; height:6px; border-radius:50%; background:#C9BBA9;\"><\u002Fspan>Echoes<\u002Fdiv>\n      <div style=\"margin-top:auto; display:flex; align-items:center; gap:11px; padding:8px 10px;\">\n        <span style=\"width:32px; height:32px; border-radius:50%; background:var(--people); color:var(--bg); font-family:'Lora',serif; font-size:15px; display:flex; align-items:center; justify-content:center;\">J<\u002Fspan>\n        <span style=\"font-size:13px; color:var(--text-secondary);\">Jess<\u002Fspan>\n      <\u002Fdiv>\n    <\u002Faside>\n\n    <!-- main / Home -->\n    <main style=\"flex:1; padding:46px 56px; display:flex; flex-direction:column; gap:30px; min-width:0; overflow:hidden;\">\n      <div>\n        <div style=\"font-size:12px; font-weight:600; letter-spacing:.08em; text-transform:uppercase; color:var(--text-muted);\">Tuesday morning<\u002Fdiv>\n        <div style=\"font-family:'Lora',serif; font-size:32px; color:var(--text-primary); margin-top:6px;\">Good morning, Jess<\u002Fdiv>\n      <\u002Fdiv>\n\n      <!-- THE NUDGE -->\n      <x-import component-from-global-scope=\"LoopDesignSystem_96f8bb.PaperCard\" raised=\"{{ true }}\" interactive=\"{{ true }}\" padding=\"{{ 28 }}\" onclick=\"{{ open } s:16px; overflow:hidden; box-shadow:0 2px 6px rgba(42,31,27,.10),0 16px 32px rgba(42,31,27,.14);\">\n      <img src=\"f6a2de1e-8bf3-4b6d-a922-10e96c0490a5\" alt=\"Marcus\" style=\"width:100%; height:188px; object-fit:cover; display:block; filter:sepia(.32) saturate(1.05) hue-rotate(-8deg);\">\n    <\u002Fdiv>\n    <div style=\"font-family:'Lora',serif; font-style:italic; font-size:17px; color:var(--text-secondary); line-height:1.5; margin-top:18px;\">It's been a good while since you two were in the same city.<\u002Fdiv>\n    <div style=\"font-size:15px; color:var(--text-primary); line-height:1.65; margin-top:14px;\">He played his first headline gig last month — the band sold out the back room at Sneaky Pete's. He spent the weekend after up in the Highlands, and he's finally found a flat in Leith.<\u002Fdiv>\n    <div style=\"font-size:13px; color:var(--text-muted); margin-top:18px;\">Opens a message in iMessage — say whatever feels right.<\u002Fdiv>\n  <\u002Fx-import>\n\n  <!-- confirmation -->\n  <x-import component-from-global-scope=\"LoopDesignSystem_96f8bb.Toast\" open=\"{{ toastOpen }}\" onclose=\"{{ closeToast }}\" message=\"Opening Messages — say whatever feels right.\" tone=\"neutral\" inline=\"{{ true }}\" hint-size=\"auto,auto\"><\u002Fx-import>\n\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;$preview&quot;:{&quot;width&quot;:1272,&quot;height&quot;:872},&quot;showChapterContext&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;},&quot;openDetail&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;}}\">\nclass Component extends DCLogic {\n  state = { detailOpen: false, toastOpen: false };\n\n  componentDidMount() {\n    if (this.props.openDetail) this.setState({ detailOpen: true });\n  }\n  componentDidUpdate(prev) {\n    if (prev.openDetail !== this.props.openDetail) {\n      this.setState({ detailOpen: !!this.props.openDetail });\n    }\n  }\n\n  renderVals() {\n    const open = () => this.setState({ detailOpen: true });\n    const close = () => this.setState({ detailOpen: false });\n    const reachOut = () => this.setState({ detailOpen: false, toastOpen: true });\n    const closeToast = () => this.setState({ toastOpen: false });\n\n    const arrowIcon = React.createElement(\n      \"svg\",\n      { width: 18, height: 18, viewBox: \"0 0 24 24\", fill: \"none\", stroke: \"currentColor\", strokeWidth: 2, strokeLinecap: \"round\", strokeLinejoin: \"round\" },\n      React.createElement(\"path\", { d: \"M5 12h14\" }),\n      React.createElement(\"path\", { d: \"M13 6l6 6-6 6\" })\n    );\n\n    const DS = (window.LoopDesignSystem_96f8bb) || {};\n    const reachOutBtn = DS.Button\n      ? React.createElement(DS.Button, { variant: \"primary\", size: \"lg\", iconRight: arrowIcon, onClick: reachOut }, \"Reach out\")\n      : null;\n\n    return {\n      showChapters: this.props.showChapterContext !== false,\n      detailOpen: this.state.detailOpen,\n      toastOpen: this.state.toastOpen,\n      open, close, reachOut, closeToast, arrowIcon, reachOutBtn,\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
