<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Loop — Echoes Card (MAV-98 · Standalone)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,500;0,600;1,400;1,500;1,600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; background: #E8DBCA; -webkit-font-smoothing: antialiased; }
  #root { min-height: 100vh; }
  @media (prefers-reduced-motion: no-preference) {
    .echo-pulse { animation: echoPulse 2.6s cubic-bezier(0.22,0.61,0.36,1) infinite; }
  }
  @keyframes echoPulse { 0% { transform: scale(0.7); opacity: .7 } 70% { transform: scale(2); opacity: 0 } 100% { transform: scale(2); opacity: 0 } }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel" data-presets="env,react">
// MAV-98 — Echoes Card (standalone, Mac app)
// Quiet anniversary "echo" surfaced inside the Loop Mac app + the shareable card.
(function () {
  const { useState, useRef, useEffect } = React;

  const T = {
    bg:'#F9F5EE', surface:'#EFE6D6', surfaceRaised:'#E8DBCA',
    ink:'#2A1F1B', inkMid:'#6B5447', inkMuted:'#A38F85',
    terracotta:'#B8624A', terracottaLt:'#D4856E', terracottaFnt:'#F5EAD8',
    rose:'#C49A8A', sage:'#6A9470', line:'#DDD0C0', lineLight:'#EDE3D5',
  };
  const serif = '"Lora", Georgia, serif';
  const sans  = '"Inter", -apple-system, sans-serif';
  const ease  = 'cubic-bezier(0.22, 0.61, 0.36, 1)';
  const WIN_W = 960, WIN_H = 660, BAR_H = 42;

  const CREW = [
    { i:'NB', name:'Nia', c:'#C49C8C', t:'#FFF4EC', off:-7, rot:-3 },
    { i:'TK', name:'Tom', c:'#B85C42', t:'#FFF2EA', off: 9, rot: 2 },
    { i:'RL', name:'Ros', c:'#4A8A5A', t:'#CAF2D2', off:-4, rot:-2 },
    { i:'MJ', name:'Mia', c:'#D4876E', t:'#FFF2EA', off: 8, rot: 3 },
  ];
  const ECHO = {
    chapter:'Casa Mañana', years:'4 years',
    line:'Four years. Six people. Three still close.',
    ago:'Four years ago today.',
  };
  const CHAPTERS = [
    { name:'Casa Mañana', era:'2022 – now',  crew:['NB','TK','RL','MJ'], nBg:'#B8624A', nFg:'#FFF6F0', active:true },
    { name:'Flat Four',   era:'2021 – 2022', crew:['MJ','RL','NB'],      nBg:'#6A3420', nFg:'#F5E0CC' },
    { name:'The Boys',    era:'2019 – 2021', crew:['TK','RL','MJ','NB'], nBg:'#4E2C14', nFg:'rgba(249,245,238,0.78)' },
  ];

  function LoopMark({ size=14, color=T.terracotta }) {
    return (
      <svg width={size} height={size} viewBox="0 0 120 120" fill="none" aria-hidden="true">
        <path d="M67 40 C 92 40, 96 74, 72 82 C 48 90, 30 74, 33 54 C 36 36, 58 28, 74 36 C 92 45, 92 78, 66 84 C 44 89, 26 76, 26 76"
          stroke={color} strokeWidth="10" strokeLinecap="round" fill="none"/>
      </svg>
    );
  }
  function Avatar({ m, size, overlap }) {
    const fz = Math.max(11, Math.round(size*0.36));
    return (
      <div style={{ width:size, height:size, borderRadius:'50%', background:m.c, color:m.t,
        display:'flex', alignItems:'center', justifyContent:'center',
        fontFamily:sans, fontSize:fz, fontWeight:600, letterSpacing:'-0.01em',
        marginLeft: overlap ? -overlap : 0, transform:`translateY(${m.off}px) rotate(${m.rot}deg)`,
        boxShadow:'0 2px 8px rgba(42,31,27,0.10)', border:'2px solid rgba(255,255,255,0.55)',
        flexShrink:0, userSelect:'none' }}>{m.i}</div>
    );
  }

  function GlyphIG({ s=22 }) { return (
    <svg width={s} height={s} viewBox="0 0 24 24" fill="none">
      <rect x="3.5" y="3.5" width="17" height="17" rx="5" stroke={T.ink} strokeWidth="1.6"/>
      <circle cx="12" cy="12" r="4" stroke={T.ink} strokeWidth="1.6"/>
      <circle cx="17.2" cy="6.8" r="1.1" fill={T.ink}/>
    </svg> ); }
  function GlyphWA({ s=22 }) { return (
    <svg width={s} height={s} viewBox="0 0 24 24" fill="none">
      <path d="M12 3.6c-4.6 0-8.4 3.6-8.4 8.1 0 1.6.5 3.1 1.3 4.4L3.6 20.4l4.5-1.2c1.2.6 2.5 1 3.9 1 4.6 0 8.4-3.6 8.4-8.1S16.6 3.6 12 3.6Z"
        stroke={T.ink} strokeWidth="1.6" strokeLinejoin="round"/>
    </svg> ); }
  function GlyphSave({ s=22 }) { return (
    <svg width={s} height={s} viewBox="0 0 24 24" fill="none">
      <path d="M12 4v10m0 0 4-4m-4 4-4-4" stroke={T.ink} strokeWidth="1.6" strokeLinecap="round" strokeLinejoin="round"/>
      <path d="M5 18.5h14" stroke={T.ink} strokeWidth="1.6" strokeLinecap="round"/>
    </svg> ); }

  function ShareTray({ onShare, onDim }) {
    const items = [
      { id:'ig', label:'IG Story', G:GlyphIG },
      { id:'wa', label:'WhatsApp', G:GlyphWA },
      { id:'save', label:'Save Image', G:GlyphSave },
    ];
    return (
      <div style={{ display:'flex', justifyContent:'center', gap:30 }}>
        {items.map(it => (
          <button key={it.id} onClick={() => onShare(it.id)} style={{
            background:'none', border:'none', cursor:'pointer', padding:0,
            display:'flex', flexDirection:'column', alignItems:'center', gap:8 }}>
            <span style={{ width:48, height:48, borderRadius:'50%', background:T.bg,
              border:`1px solid ${T.line}`, display:'flex', alignItems:'center', justifyContent:'center' }}>
              <it.G/>
            </span>
            <span style={{ fontFamily:sans, fontSize:12, fontWeight:500, color: onDim ? '#F3E9DC' : T.inkMid }}>{it.label}</span>
          </button>
        ))}
      </div>
    );
  }

  function Eyebrow({ children }) { return (
    <div style={{ fontFamily:sans, fontSize:11, fontWeight:600, letterSpacing:'0.22em',
      color:T.terracotta, textTransform:'uppercase', whiteSpace:'nowrap' }}>{children}</div> ); }
  function Sentence({ children, max=230 }) { return (
    <div style={{ fontFamily:serif, fontStyle:'italic', fontSize:17, lineHeight:1.5,
      color:T.inkMid, textAlign:'center', maxWidth:max, textWrap:'pretty' }}>{children}</div> ); }
  function Signature() { return (
    <div style={{ display:'flex', alignItems:'center', justifyContent:'center', gap:6, opacity:0.7 }}>
      <LoopMark size={13}/>
      <span style={{ fontFamily:serif, fontSize:12, fontWeight:600, color:T.inkMuted }}>Loop</span>
    </div> ); }

  function EchoCard({ variant }) {
    const shell = { position:'relative', width:340, height:478, background:T.bg,
      borderRadius:20, border:`1px solid ${T.lineLight}`,
      boxShadow:'0 1px 0 rgba(255,255,255,0.6) inset, 0 26px 60px -22px rgba(42,31,27,0.42), 0 8px 20px -12px rgba(42,31,27,0.24)',
      overflow:'hidden', display:'flex', flexDirection:'column', padding:'40px 30px 26px', flexShrink:0 };

    if (variant === 'B') return (
      <div style={shell}>
        <div style={{ flex:1, display:'flex', flexDirection:'column', alignItems:'center', justifyContent:'center', gap:26 }}>
          <div style={{ display:'flex', alignItems:'center', justifyContent:'center', paddingTop:8 }}>
            {CREW.map(m => <Avatar key={m.i} m={m} size={58} overlap={15}/>)}
          </div>
          <div style={{ display:'flex', flexDirection:'column', alignItems:'center', gap:11 }}>
            <Eyebrow>An echo</Eyebrow>
            <h1 style={{ fontFamily:serif, fontSize:34, fontWeight:500, color:T.ink, textAlign:'center', lineHeight:1.12, letterSpacing:'-0.015em', margin:0 }}>{ECHO.chapter}</h1>
            <div style={{ fontFamily:serif, fontStyle:'italic', fontSize:18, color:T.terracotta, whiteSpace:'nowrap' }}>{ECHO.years}</div>
            <Sentence>{ECHO.line}</Sentence>
          </div>
        </div>
        <Signature/>
      </div>
    );
    if (variant === 'C') return (
      <div style={shell}>
        <div style={{ flex:1, display:'flex', flexDirection:'column', alignItems:'center', justifyContent:'center', gap:28 }}>
          <Eyebrow>An echo</Eyebrow>
          <h1 style={{ fontFamily:serif, fontSize:46, fontWeight:500, color:T.ink, textAlign:'center', lineHeight:1.08, letterSpacing:'-0.02em', margin:0 }}>Casa<br/>Mañana</h1>
          <Sentence max={210}>{ECHO.line}</Sentence>
        </div>
        <Signature/>
      </div>
    );
    return ( // A — typographic-forward (default)
      <div style={shell}>
        <div style={{ flex:1, display:'flex', flexDirection:'column', alignItems:'center', justifyContent:'center', gap:20 }}>
          <Eyebrow>An echo</Eyebrow>
          <h1 style={{ fontFamily:serif, fontSize:48, fontWeight:500, color:T.ink, textAlign:'center', lineHeight:1.06, letterSpacing:'-0.02em', margin:0 }}>Casa<br/>Mañana</h1>
          <div style={{ fontFamily:serif, fontStyle:'italic', fontSize:21, color:T.terracotta, whiteSpace:'nowrap' }}>{ECHO.years}</div>
          <Sentence max={210}>{ECHO.line}</Sentence>
        </div>
        <div style={{ display:'flex', flexDirection:'column', alignItems:'center', gap:18 }}>
          <div style={{ display:'flex', alignItems:'center', justifyContent:'center' }}>
            {CREW.map(m => <Avatar key={m.i} m={m} size={38} overlap={11}/>)}
          </div>
          <Signature/>
        </div>
      </div>
    );
  }

  // ── Mac window chrome (matches MAV-77 / MAV-82) ─────────────────────────────
  function MacWindow({ children }) {
    return (
      <div style={{ width:WIN_W, height:WIN_H, borderRadius:13, overflow:'hidden', flexShrink:0,
        display:'flex', flexDirection:'column', background:T.bg,
        boxShadow:'0 8px 28px rgba(0,0,0,0.30), 0 40px 90px rgba(0,0,0,0.38)' }}>
        <div style={{ height:BAR_H, flexShrink:0, background:T.surface, borderBottom:`1px solid ${T.lineLight}`,
          display:'flex', alignItems:'center', padding:'0 14px', userSelect:'none' }}>
          <div style={{ display:'flex', gap:6 }}>
            {['#E0685B','#E8B14C','#7CB45C'].map((c,i) => <span key={i} style={{ width:11, height:11, borderRadius:999, background:c }}/>)}
          </div>
          <div style={{ flex:1, display:'flex', justifyContent:'center', alignItems:'center', gap:6 }}>
            <LoopMark size={14}/>
            <span style={{ fontFamily:serif, fontSize:13, fontWeight:600, color:T.ink, letterSpacing:'-0.005em' }}>Loop</span>
          </div>
          <div style={{ width:45 }}/>
        </div>
        <div style={{ flex:1, position:'relative', overflow:'hidden' }}>{children}</div>
      </div>
    );
  }

  function ChapterRow({ ch }) {
    return (
      <div style={{ display:'flex', alignItems:'center', gap:16, padding:'15px 4px' }}>
        <div style={{ width:54, height:54, borderRadius:'50%', flexShrink:0, background:ch.nBg, color:ch.nFg,
          display:'flex', alignItems:'center', justifyContent:'center', fontFamily:serif,
          fontStyle:ch.active?'italic':'normal', fontSize:12, fontWeight:500, textAlign:'center', lineHeight:1.1, padding:'0 6px',
          boxShadow:ch.active?'0 4px 16px rgba(184,98,74,0.28)':'none' }}>{ch.name.split(' ')[0]}</div>
        <div style={{ flex:1, minWidth:0 }}>
          <div style={{ fontFamily:serif, fontSize:18, fontWeight:500, color:T.ink, letterSpacing:'-0.01em' }}>{ch.name}</div>
          <div style={{ fontFamily:sans, fontSize:11, color:T.inkMuted, letterSpacing:'0.08em', textTransform:'uppercase', marginTop:2 }}>{ch.era}</div>
        </div>
        <div style={{ display:'flex' }}>
          {ch.crew.slice(0,4).map((ci,k) => { const m = CREW.find(x=>x.i===ci)||{i:ci,c:T.rose,t:'#fff'};
            return <div key={k} style={{ width:26, height:26, borderRadius:'50%', marginLeft:k?-8:0, background:m.c, color:m.t,
              border:`2px solid ${T.bg}`, display:'flex', alignItems:'center', justifyContent:'center', fontFamily:sans, fontSize:9.5, fontWeight:600 }}>{m.i}</div>; })}
        </div>
      </div>
    );
  }

  function ArrivalBand({ onSeeIt }) {
    return (
      <div style={{ margin:'8px 0 26px', background:T.terracottaFnt, border:`1px solid ${T.lineLight}`,
        borderRadius:18, padding:'18px 20px', display:'flex', alignItems:'center', gap:16,
        boxShadow:'0 2px 10px rgba(42,31,27,0.04)' }}>
        <span style={{ position:'relative', display:'flex', flexShrink:0 }}>
          <span style={{ width:9, height:9, borderRadius:'50%', background:T.terracotta }}/>
          <span className="echo-pulse" style={{ position:'absolute', inset:-5, borderRadius:'50%', border:`1.5px solid ${T.terracotta}` }}/>
        </span>
        <div style={{ flex:1, minWidth:0 }}>
          <div style={{ fontFamily:serif, fontSize:17, fontWeight:500, color:T.ink, letterSpacing:'-0.005em' }}>An echo from {ECHO.chapter}.</div>
          <div style={{ fontFamily:sans, fontSize:13, color:T.inkMid, marginTop:2 }}>{ECHO.ago}</div>
        </div>
        <button onClick={onSeeIt} style={{ flexShrink:0, background:T.terracotta, border:'none', cursor:'pointer',
          color:'#FFF0E8', fontFamily:sans, fontSize:14, fontWeight:600, padding:'10px 22px', borderRadius:999, letterSpacing:'-0.01em' }}>See it</button>
      </div>
    );
  }

  function Home({ onSeeIt }) {
    return (
      <div style={{ position:'absolute', inset:0, overflow:'auto', display:'flex', justifyContent:'center', padding:'34px 40px' }}>
        <div style={{ width:'100%', maxWidth:560 }}>
          <div style={{ display:'flex', alignItems:'baseline', justifyContent:'space-between', marginBottom:6 }}>
            <h1 style={{ fontFamily:serif, fontSize:32, fontWeight:600, color:T.ink, letterSpacing:'-0.02em', margin:0, whiteSpace:'nowrap' }}>Your Loops</h1>
          </div>
          <ArrivalBand onSeeIt={onSeeIt}/>
          <div style={{ fontFamily:sans, fontSize:11, fontWeight:600, letterSpacing:'0.14em', textTransform:'uppercase', color:T.inkMuted, margin:'2px 4px 4px' }}>Chapters</div>
          <div style={{ borderTop:`1px solid ${T.lineLight}` }}>
            {CHAPTERS.map((ch,i) => <div key={i} style={{ borderBottom:`1px solid ${T.lineLight}` }}><ChapterRow ch={ch}/></div>)}
          </div>
        </div>
      </div>
    );
  }

  function CardOverlay({ variant, mounted, onClose, onShare }) {
    return (
      <div onClick={onClose} style={{ position:'absolute', inset:0, zIndex:30,
        background: mounted ? 'rgba(36,24,18,0.46)' : 'rgba(36,24,18,0)',
        backdropFilter: mounted ? 'blur(3px)' : 'none', WebkitBackdropFilter: mounted ? 'blur(3px)' : 'none',
        transition:`background 360ms ${ease}`,
        display:'flex', flexDirection:'column', alignItems:'center', justifyContent:'center', gap:26, padding:24 }}>
        <button onClick={(e)=>{ e.stopPropagation(); onClose(); }} style={{ position:'absolute', top:16, right:16,
          width:36, height:36, borderRadius:'50%', border:'1px solid rgba(255,255,255,0.25)', background:'rgba(255,255,255,0.10)',
          cursor:'pointer', display:'flex', alignItems:'center', justifyContent:'center' }} aria-label="Close">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M3.5 3.5l9 9m0-9l-9 9" stroke="#F3E9DC" strokeWidth="1.6" strokeLinecap="round"/></svg>
        </button>
        <div onClick={(e)=>e.stopPropagation()} style={{ display:'flex', flexDirection:'column', alignItems:'center', gap:24,
          transform: mounted ? 'translateY(0) scale(1)' : 'translateY(14px) scale(0.985)', opacity: mounted ? 1 : 0,
          transition:`transform 460ms ${ease}, opacity 360ms ${ease}` }}>
          <EchoCard variant={variant}/>
          <ShareTray onShare={onShare} onDim/>
        </div>
      </div>
    );
  }

  function Toast({ text }) {
    if (!text) return null;
    return (
      <div style={{ position:'absolute', left:'50%', bottom:28, transform:'translateX(-50%)', zIndex:50,
        background:'rgba(42,31,27,0.92)', color:'#F6EFE6', fontFamily:sans, fontSize:13.5, fontWeight:500,
        padding:'11px 20px', borderRadius:999, whiteSpace:'nowrap', boxShadow:'0 8px 24px rgba(42,31,27,0.28)' }}>{text}</div>
    );
  }

  function App() {
    const [view, setView] = useState('home');
    const [variant, setVariant] = useState('A');
    const [mounted, setMounted] = useState(false);
    const [toast, setToast] = useState('');
    const [scale, setScale] = useState(1);
    const tt = useRef(null);

    useEffect(() => {
      function r() {
        const sx = (window.innerWidth - 72) / WIN_W;
        const sy = (window.innerHeight - 116) / WIN_H;
        setScale(Math.min(sx, sy, 1));
      }
      window.addEventListener('resize', r); r();
      return () => window.removeEventListener('resize', r);
    }, []);

    function openCard() { setView('card'); setTimeout(() => setMounted(true), 30); }
    function closeCard() { setMounted(false); setTimeout(() => setView('home'), 340); }
    function showToast(t) { setToast(t); clearTimeout(tt.current); tt.current = setTimeout(() => setToast(''), 1900); }
    function onShare(id) { showToast(id==='save' ? 'Saved to Photos' : id==='ig' ? 'Opening Instagram…' : 'Opening WhatsApp…'); }

    return (
      <div style={{ minHeight:'100vh', width:'100%',
        background:`radial-gradient(120% 90% at 50% 0%, ${T.surfaceRaised} 0%, ${T.surface} 62%)`,
        display:'flex', flexDirection:'column', alignItems:'center', justifyContent:'center', padding:'24px 0 20px', gap:18, boxSizing:'border-box' }}>
        <div style={{ width:WIN_W*scale, height:WIN_H*scale, flexShrink:0 }}>
          <div style={{ width:WIN_W, height:WIN_H, transform:`scale(${scale})`, transformOrigin:'top left' }}>
            <MacWindow>
              <Home onSeeIt={openCard}/>
              {view === 'card' && <CardOverlay variant={variant} mounted={mounted} onClose={closeCard} onShare={onShare}/>}
              <Toast text={toast}/>
            </MacWindow>
          </div>
        </div>
        <div style={{ display:'flex', alignItems:'center', gap:12, fontFamily:sans }}>
          <span style={{ fontSize:12, fontWeight:600, letterSpacing:'0.12em', textTransform:'uppercase', color:T.inkMuted }}>Echo layout</span>
          <div style={{ display:'flex', gap:4, background:T.bg, border:`1px solid ${T.line}`, borderRadius:999, padding:4 }}>
            {[['A','Typographic'],['B','Avatar'],['C','Minimal']].map(([k,lbl]) => (
              <button key={k} onClick={() => setVariant(k)} style={{ border:'none', cursor:'pointer', borderRadius:999,
                padding:'7px 14px', fontFamily:sans, fontSize:12.5, fontWeight:600,
                background: variant===k ? T.terracotta : 'transparent', color: variant===k ? '#FFF0E8' : T.inkMid,
                transition:`background 160ms ${ease}` }}>{k} · {lbl}</button>
            ))}
          </div>
        </div>
      </div>
    );
  }

  ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
})();
</script>
</body>
</html>
