<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Loop — Chapter Naming (MAV-78)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,500;0,600;1,400;1,600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<style>
  /* ── Loop design tokens (self-contained) ── */
  :root {
    --bg:              #F9F5EE;
    --surface:         #EFE6D6;
    --surface-raised:  #E8DBCA;
    --text-primary:    #2A1F1B;
    --text-secondary:  #6B5447;
    --text-muted:      #A38F85;
    --text-on-accent:  #F9F5EE;
    --accent:          #B8624A;
    --accent-hover:    #A6543E;
    --accent-light:    #D4856E;
    --accent-faint:    #F5EAD8;
    --border:          #DDD0C0;
    --border-light:    #EDE3D5;
    --rose:            #C49A8A;
    --terracotta-faint:#F5EAD8;
    --sage:            #6A9470;
    --font-sans:       "Inter", -apple-system, sans-serif;
    --font-serif:      "Lora", Georgia, serif;
    --radius-sm:       8px;
    --radius-md:       12px;
    --radius-lg:       18px;
    --radius-full:     999px;
    --shadow-sm:       0 1px 2px rgba(42,31,27,0.05), 0 1px 3px rgba(42,31,27,0.04);
    --shadow-md:       0 1px 2px rgba(42,31,27,0.05), 0 4px 12px rgba(42,31,27,0.07);
    --ease-out:        cubic-bezier(0.22, 0.61, 0.36, 1);
    --duration-fast:   120ms;
    --duration-base:   200ms;
  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; background: var(--bg); -webkit-font-smoothing: antialiased; }
  #root { min-height: 100vh; }
  *::-webkit-scrollbar { width: 11px; }
  *::-webkit-scrollbar-thumb { background: var(--surface-raised); border-radius: 999px; border: 3px solid var(--bg); }
  *::-webkit-scrollbar-track { background: transparent; }
  ::selection { background: rgba(184,98,74,0.18); color: var(--text-primary); }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel" data-presets="env,react">
// MAV-78 — Chapter Naming
// Self-contained: no _ds_bundle.js, no external JSX file.
// WhatsApp name IS the chapter identity. Pencil = optional personalisation.

(function () {
  const { useState, useRef, useEffect } = React;

  // ── data ──────────────────────────────────────────────────────────────────
  const GROUPS = [
    {
      id: 'boys',
      whatsapp: '🍕 The Boys',
      members: ['Sam W', 'Marcus B', 'Danny M', 'Jo O', 'Tom R', 'Elena C', 'Priya R', 'Nadia H'],
      count: 8,
    },
    {
      id: 'edinburgh',
      whatsapp: 'Edinburgh Dissertation Gang',
      members: ['Priya R', 'Nadia H', 'Tom R', 'Marcus B', 'Sam W', 'Elena C'],
      count: 6,
    },
    {
      id: 'family',
      whatsapp: "Mama's Kitchen 🥘",
      members: ['Tom R', 'Nadia H', 'Priya R', 'Danny M', 'Marcus B', 'Elena C', 'Sam W', 'Jo O'],
      count: 12,
    },
    {
      id: 'work',
      whatsapp: 'Work (Old Job)',
      members: ['Marcus B', 'Elena C', 'Sam W', 'Jo O'],
      count: 23,
    },
    {
      id: 'paddington',
      whatsapp: 'Paddington Housemates',
      members: ['Danny M', 'Jo O', 'Elena C', 'Nadia H', 'Tom R'],
      count: 5,
    },
    {
      id: 'fam',
      whatsapp: 'The Fam 👨‍👩‍👧‍👦',
      members: ['Tom R', 'Nadia H', 'Marcus B', 'Danny M', 'Elena C', 'Sam W', 'Jo O', 'Priya R'],
      count: 9,
    },
  ];

  // ── local Button ──────────────────────────────────────────────────────────
  function Button({ variant = 'primary', size = 'md', disabled = false, onClick, children, style }) {
    const [hover, setHover] = useState(false);
    const [press, setPress] = useState(false);
    const heights = { sm: 30, md: 38, lg: 46 };
    const pads    = { sm: '0 12px', md: '0 18px', lg: '0 24px' };
    const fonts   = { sm: 13, md: 14, lg: 15 };
    const bgMap   = {
      primary:   hover ? '#A6543E' : 'var(--accent)',
      secondary: hover ? 'var(--accent-faint)' : 'var(--surface-raised)',
      ghost:     hover ? 'var(--accent-faint)' : 'transparent',
    };
    const colorMap = {
      primary:   'var(--text-on-accent)',
      secondary: 'var(--text-primary)',
      ghost:     'var(--accent)',
    };
    return (
      <button
        onClick={onClick}
        disabled={disabled}
        onMouseEnter={() => setHover(true)}
        onMouseLeave={() => { setHover(false); setPress(false); }}
        onMouseDown={() => setPress(true)}
        onMouseUp={() => setPress(false)}
        style={{
          display: 'inline-flex', alignItems: 'center', justifyContent: 'center',
          gap: 8,
          height: heights[size],
          padding: pads[size],
          fontFamily: 'var(--font-sans)',
          fontSize: fonts[size],
          fontWeight: 600,
          lineHeight: 1,
          borderRadius: 'var(--radius-full)',
          border: 'none',
          cursor: disabled ? 'not-allowed' : 'pointer',
          opacity: disabled ? 0.5 : 1,
          background: bgMap[variant],
          color: colorMap[variant],
          boxShadow: variant === 'ghost' ? 'none' : 'var(--shadow-sm)',
          transform: press && !disabled ? 'translateY(0.5px) scale(0.985)' : 'none',
          transition: 'background var(--duration-fast) var(--ease-out), transform var(--duration-fast) var(--ease-out)',
          whiteSpace: 'nowrap',
          userSelect: 'none',
          ...style,
        }}
      >
        {children}
      </button>
    );
  }

  // ── local Avatar ──────────────────────────────────────────────────────────
  function Avatar({ name = '', size = 44 }) {
    const initials = name.split(/\s+/).filter(Boolean).slice(0, 2).map(w => w[0]).join('').toUpperCase();
    const tints = ['#C49A8A', '#D4856E', '#6A9470', '#C49A8A', '#B8624A'];
    let h = 0;
    for (let i = 0; i < name.length; i++) h = (h * 31 + name.charCodeAt(i)) >>> 0;
    const bg = tints[h % tints.length];
    return (
      <div style={{
        width: size, height: size,
        borderRadius: 'var(--radius-full)',
        flexShrink: 0,
        background: bg,
        color: '#F9F5EE',
        display: 'flex', alignItems: 'center', justifyContent: 'center',
        fontFamily: 'var(--font-sans)',
        fontWeight: 600,
        fontSize: Math.round(size * 0.38),
        letterSpacing: '0.01em',
        boxShadow: 'var(--shadow-sm)',
      }}>
        {initials}
      </div>
    );
  }

  // ── local ProgressDots ────────────────────────────────────────────────────
  function ProgressDots({ count = 3, active = 0 }) {
    return (
      <div style={{ display: 'flex', gap: 8, alignItems: 'center' }}>
        {Array.from({ length: count }, (_, i) => (
          <div key={i} style={{
            width: i === active ? 22 : 6,
            height: 6,
            borderRadius: 'var(--radius-full)',
            background: i === active ? 'var(--accent)' : i < active ? 'var(--accent-light)' : 'var(--border-light)',
            opacity: i < active ? 0.5 : 1,
            transition: 'all var(--duration-base) var(--ease-out)',
          }} />
        ))}
      </div>
    );
  }

  // ── avatar strip ───────────────────────────────────────────────────────────
  function AvatarStrip({ members, total, max = 4 }) {
    const shown    = members.slice(0, max);
    const overflow = total - max;
    return (
      <div style={{ display: 'flex', alignItems: 'center' }}>
        {shown.map((name, i) => (
          <div key={i} style={{
            marginLeft: i === 0 ? 0 : -8,
            zIndex: max - i,
            borderRadius: 999,
            boxShadow: '0 0 0 2px var(--bg)',
          }}>
            <Avatar name={name} size={26} />
          </div>
        ))}
        {overflow > 0 && (
          <div style={{
            marginLeft: -8, zIndex: 0,
            width: 26, height: 26,
            borderRadius: 999,
            background: 'var(--surface-raised)',
            border: '2px solid var(--bg)',
            display: 'flex', alignItems: 'center', justifyContent: 'center',
            fontFamily: 'var(--font-sans)', fontSize: 9.5, fontWeight: 700,
            color: 'var(--text-muted)',
          }}>
            +{overflow}
          </div>
        )}
      </div>
    );
  }

  // ── pencil icon ────────────────────────────────────────────────────────────
  function PencilIcon({ size = 12 }) {
    return (
      <svg width={size} height={size} viewBox="0 0 24 24" fill="none"
        stroke="currentColor" strokeWidth="2.2"
        strokeLinecap="round" strokeLinejoin="round"
        aria-hidden="true" style={{ flexShrink: 0, display: 'block' }}>
        <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7" />
        <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z" />
      </svg>
    );
  }

  // ── group card ─────────────────────────────────────────────────────────────
  function GroupCard({ group, selected, chapterName, onToggle, onRename }) {
    const [editing,   setEditing]   = useState(false);
    const [draft,     setDraft]     = useState(chapterName);
    const [hov,       setHov]       = useState(false);
    const [pencilHov, setPencilHov] = useState(false);
    const inputRef = useRef(null);

    useEffect(() => { setDraft(chapterName); }, [chapterName]);
    useEffect(() => { if (editing) { inputRef.current && inputRef.current.focus(); inputRef.current && inputRef.current.select(); } }, [editing]);

    const commit = () => {
      setEditing(false);
      const trimmed = draft.trim();
      if (trimmed) onRename(trimmed);
      else setDraft(chapterName);
    };

    const openEdit = (e) => {
      e.stopPropagation();
      setEditing(true);
      if (!selected) onToggle();
    };

    const renamed = chapterName !== group.whatsapp;

    return (
      <div
        onMouseEnter={() => setHov(true)}
        onMouseLeave={() => setHov(false)}
        style={{
          background: 'var(--bg)',
          borderRadius: 'var(--radius-lg)',
          border: selected
            ? '2px solid var(--accent)'
            : ('2px solid ' + (hov ? 'var(--border)' : 'transparent')),
          boxShadow: selected
            ? '0 0 0 4px rgba(184,98,74,0.10), var(--shadow-sm)'
            : 'var(--shadow-sm)',
          padding: '18px 20px',
          transition: 'border-color 160ms ease, box-shadow 160ms ease',
          display: 'flex',
          alignItems: 'center',
          gap: 16,
        }}
      >
        {/* left content — clicking the body area toggles selection */}
        <div
          style={{ flex: 1, minWidth: 0, cursor: 'pointer' }}
          role="button"
          tabIndex={0}
          onClick={onToggle}
          onKeyDown={(e) => e.key === 'Enter' && onToggle()}
        >
          {/* primary name row */}
          <div style={{ marginBottom: renamed ? 2 : 10 }}>
            {editing ? (
              <input
                ref={inputRef}
                value={draft}
                onChange={(e) => setDraft(e.target.value)}
                onBlur={commit}
                onKeyDown={(e) => {
                  if (e.key === 'Enter') commit();
                  if (e.key === 'Escape') { setEditing(false); setDraft(chapterName); }
                }}
                onClick={(e) => e.stopPropagation()}
                style={{
                  fontFamily: 'var(--font-serif)',
                  fontSize: 21,
                  fontWeight: 600,
                  color: 'var(--text-primary)',
                  letterSpacing: '-0.01em',
                  lineHeight: 1.2,
                  background: 'transparent',
                  border: 'none',
                  borderBottom: '2px solid var(--accent)',
                  outline: 'none',
                  width: '100%',
                  padding: '0 0 2px',
                }}
              />
            ) : (
              <>
                <span style={{
                  fontFamily: 'var(--font-serif)',
                  fontSize: 21,
                  fontWeight: 600,
                  color: 'var(--text-primary)',
                  letterSpacing: '-0.01em',
                  lineHeight: 1.3,
                }}>
                  {chapterName}
                </span>
                {/* pencil — trails inline, whisper quiet */}
                <button
                  onClick={openEdit}
                  onMouseEnter={() => setPencilHov(true)}
                  onMouseLeave={() => setPencilHov(false)}
                  title="Rename chapter"
                  style={{
                    all: 'unset',
                    display: 'inline-flex',
                    alignItems: 'center',
                    verticalAlign: 'middle',
                    color: pencilHov ? 'var(--text-secondary)' : 'var(--text-muted)',
                    opacity: pencilHov ? 0.7 : 0.35,
                    cursor: 'text',
                    transition: 'opacity 140ms ease, color 140ms ease',
                    marginLeft: 7,
                    position: 'relative',
                    top: -1,
                  }}
                >
                  <PencilIcon size={12} />
                </button>
              </>
            )}
          </div>

          {/* if renamed, show original WhatsApp name as quiet attribution */}
          {renamed && !editing && (
            <div style={{
              fontFamily: 'var(--font-sans)',
              fontSize: 10.5,
              color: 'var(--text-muted)',
              opacity: 0.6,
              marginBottom: 9,
              letterSpacing: '0.01em',
            }}>
              {group.whatsapp}
            </div>
          )}

          {/* avatar strip + count */}
          <div style={{ display: 'flex', alignItems: 'center', gap: 10 }}>
            <AvatarStrip members={group.members} total={group.count} />
            <span style={{
              fontFamily: 'var(--font-sans)',
              fontSize: 12,
              color: 'var(--text-muted)',
              whiteSpace: 'nowrap',
            }}>
              {group.count} members
            </span>
          </div>
        </div>

        {/* checkmark */}
        <div
          role="button"
          tabIndex={-1}
          onClick={onToggle}
          style={{
            width: 24, height: 24,
            borderRadius: 999,
            flexShrink: 0,
            border: selected ? 'none' : '2px solid var(--border)',
            background: selected ? 'var(--accent)' : 'transparent',
            display: 'flex', alignItems: 'center', justifyContent: 'center',
            transition: 'all 160ms ease',
            boxShadow: selected ? 'var(--shadow-sm)' : 'none',
            cursor: 'pointer',
          }}
        >
          {selected && (
            <svg width="11" height="9" viewBox="0 0 11 9" fill="none">
              <path d="M1 4.5L4 7.5L10 1" stroke="#FEFCF8" strokeWidth="2"
                strokeLinecap="round" strokeLinejoin="round" />
            </svg>
          )}
        </div>
      </div>
    );
  }

  // ── main screen ────────────────────────────────────────────────────────────
  function ChapterNaming() {
    const [selected,     setSelected]     = useState(new Set());
    const [chapterNames, setChapterNames] = useState(
      Object.fromEntries(GROUPS.map((g) => [g.id, g.whatsapp]))
    );

    const toggle = (id) =>
      setSelected((prev) => {
        const next = new Set(prev);
        next.has(id) ? next.delete(id) : next.add(id);
        return next;
      });

    const rename = (id, name) =>
      setChapterNames((prev) => ({ ...prev, [id]: name }));

    const selectedCount = selected.size;

    return (
      <div data-screen-label="ChapterNaming" style={{
        minHeight: '100%',
        background: 'var(--bg)',
        display: 'flex',
        flexDirection: 'column',
      }}>
        <div style={{
          maxWidth: 600,
          width: '100%',
          margin: '0 auto',
          padding: '44px 32px 140px',
        }}>

          {/* progress + step label */}
          <div style={{
            display: 'flex',
            alignItems: 'center',
            justifyContent: 'space-between',
            marginBottom: 40,
          }}>
            <ProgressDots count={3} active={0} />
            <div style={{
              fontFamily: 'var(--font-sans)',
              fontSize: 12.5,
              fontWeight: 600,
              color: 'var(--text-muted)',
              whiteSpace: 'nowrap',
            }}>
              Step 1 of 3
            </div>
          </div>

          {/* header */}
          <header style={{ marginBottom: 28 }}>
            <div style={{
              fontFamily: 'var(--font-sans)',
              fontSize: 11,
              fontWeight: 700,
              letterSpacing: '.10em',
              textTransform: 'uppercase',
              color: 'var(--text-muted)',
              marginBottom: 8,
            }}>
              Loop found 6 groups
              <span style={{
                marginLeft: 10,
                fontWeight: 500,
                letterSpacing: '.03em',
                textTransform: 'none',
                color: 'rgba(163,143,133,0.6)',
                fontSize: 10.5,
              }}>
                · 3 announcement channels hidden
              </span>
            </div>
            <h1 style={{
              fontFamily: 'var(--font-serif)',
              fontSize: 34,
              fontWeight: 600,
              color: 'var(--text-primary)',
              letterSpacing: '-0.02em',
              lineHeight: 1.15,
              margin: '0 0 10px',
            }}>
              These are your crews.
            </h1>
            <p style={{
              fontFamily: 'var(--font-sans)',
              fontSize: 15.5,
              lineHeight: 1.65,
              color: 'var(--text-secondary)',
              margin: 0,
              textWrap: 'pretty',
            }}>
              Each one becomes a chapter. Pick the ones that matter.
            </p>
          </header>

          {/* group cards */}
          <div style={{ display: 'flex', flexDirection: 'column', gap: 12 }}>
            {GROUPS.map((group) => (
              <GroupCard
                key={group.id}
                group={group}
                selected={selected.has(group.id)}
                chapterName={chapterNames[group.id]}
                onToggle={() => toggle(group.id)}
                onRename={(name) => rename(group.id, name)}
              />
            ))}
          </div>
        </div>

        {/* sticky footer */}
        <div style={{
          position: 'fixed',
          bottom: 0, left: 0, right: 0,
          zIndex: 10,
          padding: '16px 32px 28px',
          background: 'linear-gradient(to top, var(--bg) 70%, transparent)',
        }}>
          <div style={{
            maxWidth: 600,
            margin: '0 auto',
            display: 'flex',
            gap: 14,
            alignItems: 'center',
          }}>
            <Button variant="primary">
              {selectedCount > 0
                ? ('Next — ' + selectedCount + ' chapter' + (selectedCount === 1 ? '' : 's'))
                : 'Next →'}
            </Button>
            {selectedCount === 0 && (
              <Button variant="ghost">Skip for now</Button>
            )}
          </div>
        </div>
      </div>
    );
  }

  ReactDOM.createRoot(document.getElementById('root')).render(
    React.createElement(ChapterNaming)
  );
})();
</script>
</body>
</html>
