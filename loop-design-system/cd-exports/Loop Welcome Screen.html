<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Loop — Welcome</title>
<style>
  @font-face {
    font-family: "Inter";
    font-style: normal;
    font-weight: 400;
    font-display: swap;
    src: url(assets/fonts/Inter-400.woff2) format("woff2");
  }
  @font-face {
    font-family: "Inter";
    font-style: normal;
    font-weight: 500;
    font-display: swap;
    src: url(assets/fonts/Inter-500.woff2) format("woff2");
  }
  @font-face {
    font-family: "Inter";
    font-style: normal;
    font-weight: 600;
    font-display: swap;
    src: url(assets/fonts/Inter-600.woff2) format("woff2");
  }
  @font-face {
    font-family: "Lora";
    font-style: normal;
    font-weight: 400;
    font-display: swap;
    src: url(assets/fonts/Lora-400.woff2) format("woff2");
  }
  @font-face {
    font-family: "Lora";
    font-style: italic;
    font-weight: 400;
    font-display: swap;
    src: url(assets/fonts/Lora-400Italic.woff2) format("woff2");
  }
  @font-face {
    font-family: "Lora";
    font-style: normal;
    font-weight: 600;
    font-display: swap;
    src: url(assets/fonts/Lora-600.woff2) format("woff2");
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    width: 100%;
    height: 100%;
    background: #F9F5EE;
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
  }

  body {
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    font-family: "Inter", -apple-system, BlinkMacSystemFont, sans-serif;
  }

  /* ── Content zone ── */
  .welcome {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 0;
    width: 100%;
    max-width: 480px;
    padding: 0 32px;
    /* ~60% of a typical 800px launch height */
  }

  /* ── 1. Mark + Wordmark ── */
  .brand {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 16px;
    margin-bottom: 32px;
  }

  .loop-mark {
    width: 88px;
    height: 88px;
    flex-shrink: 0;
  }

  .wordmark {
    font-family: "Lora", Georgia, serif;
    font-weight: 600;
    font-size: 36px;
    color: #B8624A;
    letter-spacing: -0.01em;
    line-height: 1;
  }

  /* ── 2. Tagline ── */
  .tagline {
    font-family: "Lora", Georgia, serif;
    font-style: italic;
    font-weight: 400;
    font-size: 22px;
    color: #2A1F1B;
    line-height: 1.4;
    text-align: center;
    margin-bottom: 16px;
    text-wrap: pretty;
  }

  /* ── 2b. Bridge ── */
  .bridge {
    font-family: "Inter", -apple-system, sans-serif;
    font-size: 13px;
    font-weight: 400;
    color: #A38F85;
    text-align: center;
    margin-bottom: 36px;
    line-height: 1.5;
    letter-spacing: 0.01em;
  }

  /* ── 3. Steps strip ── */
  .steps {
    display: flex;
    flex-direction: row;
    align-items: flex-start;
    justify-content: center;
    gap: 40px;
    width: 100%;
    margin-bottom: 28px;
  }

  .step {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
    max-width: 120px;
  }

  .step-num {
    width: 24px;
    height: 24px;
    border-radius: 50%;
    border: 1.5px solid #B8624A;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: "Inter", sans-serif;
    font-size: 11px;
    font-weight: 500;
    color: #B8624A;
    flex-shrink: 0;
  }

  .step-label {
    font-family: "Inter", sans-serif;
    font-size: 12.5px;
    font-weight: 300;
    color: #A38F85;
    text-align: center;
    line-height: 1.5;
    text-wrap: pretty;
  }

  /* ── 4. Privacy line ── */
  .privacy {
    font-family: "Inter", sans-serif;
    font-size: 11.5px;
    font-weight: 400;
    color: #BBA99E;
    text-align: center;
    margin-bottom: 36px;
    letter-spacing: 0.01em;
  }

  /* ── 5. CTA ── */
  .cta {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    background: #B8624A;
    color: #F9F5EE;
    font-family: "Inter", sans-serif;
    font-size: 15px;
    font-weight: 600;
    line-height: 1;
    border: none;
    border-radius: 999px;
    height: 46px;
    padding: 0 32px;
    width: 280px;
    cursor: pointer;
    transition: background 120ms cubic-bezier(0.22, 0.61, 0.36, 1),
                transform 120ms cubic-bezier(0.22, 0.61, 0.36, 1),
                box-shadow 120ms cubic-bezier(0.22, 0.61, 0.36, 1);
    box-shadow: 0 1px 2px rgba(42,31,27,0.06), 0 2px 8px rgba(184,98,74,0.18);
    white-space: nowrap;
    user-select: none;
    -webkit-font-smoothing: antialiased;
  }

  .cta:hover {
    background: #A6543E;
    box-shadow: 0 2px 4px rgba(42,31,27,0.08), 0 4px 16px rgba(184,98,74,0.22);
  }

  .cta:active {
    transform: translateY(0.5px) scale(0.985);
    background: #9A4D39;
  }

  .cta:focus-visible {
    outline: none;
    box-shadow: 0 0 0 3px rgba(184, 98, 74, 0.28);
  }
</style>
</head>
<body>

<main class="welcome" role="main">

  <!-- 1. Brand -->
  <div class="brand">
    <svg class="loop-mark" width="88" height="88" viewBox="0 0 120 120" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <path d="M67 40
               C 92 40, 96 74, 72 82
               C 48 90, 30 74, 33 54
               C 36 36, 58 28, 74 36
               C 92 45, 92 78, 66 84
               C 44 89, 26 76, 26 76"
            stroke="#B8624A" stroke-width="7.5" stroke-linecap="round" fill="none"></path>
    </svg>
    <span class="wordmark">Loop</span>
  </div>

  <!-- 2. Tagline -->
  <p class="tagline">Every chapter of your life, and the people you lived it with.</p>

  <!-- 2b. Bridge -->
  <p class="bridge">Our lives happen in conversations with our people.</p>

  <!-- 3. Steps -->
  <div class="steps" role="list" aria-label="How Loop works">
    <div class="step" role="listitem">
      <div class="step-num" aria-hidden="true">1</div>
      <span class="step-label">Connect your WhatsApp</span>
    </div>
    <div class="step" role="listitem">
      <div class="step-num" aria-hidden="true">2</div>
      <span class="step-label">Loop maps the chapters of your life</span>
    </div>
    <div class="step" role="listitem">
      <div class="step-num" aria-hidden="true">3</div>
      <span class="step-label">Your people, still in every chapter</span>
    </div>
  </div>

  <!-- 4. Privacy -->
  <p class="privacy">Your messages never leave your Mac.</p>

  <!-- 5. CTA -->
  <button class="cta" type="button">Connect WhatsApp</button>

</main>

</body>
</html>
