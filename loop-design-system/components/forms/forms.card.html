<!DOCTYPE html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../../styles.css">
<style>
  body{margin:0;background:var(--bg);font-family:var(--font-sans);padding:28px 32px}
  .grid{display:flex;flex-direction:column;gap:22px;max-width:560px}
  .row{display:flex;gap:18px;align-items:center;flex-wrap:wrap}
</style>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="https://unpkg.com/lucide@0.460.0/dist/umd/lucide.min.js"></script>
<script src="../../_ds_bundle.js"></script>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
  const { Input, SegmentedControl, Switch } = window.LoopDesignSystem_96f8bb;
  function Ic({ name, size = 16 }) {
    const ref = React.useRef(null);
    React.useEffect(() => {
      if (ref.current) ref.current.innerHTML = lucide.createElement(lucide[name]).outerHTML;
      const svg = ref.current && ref.current.querySelector("svg");
      if (svg) { svg.setAttribute("width", size); svg.setAttribute("height", size); }
    }, []);
    return <span ref={ref} style={{display:"inline-flex"}} />;
  }
  function Demo(){
    const [view, setView] = React.useState("Timeline");
    const [on, setOn] = React.useState(true);
    return (
      <div className="grid">
        <div className="row">
          <Input label="Their name" defaultValue="Priya Raman" style={{flex:1}} />
          <Input icon={<Ic name="Search"/>} placeholder="Search everyone…" style={{flex:1}} />
        </div>
        <div className="row" style={{justifyContent:"space-between"}}>
          <SegmentedControl options={["Timeline","People","Notes"]} value={view} onChange={setView} />
          <Switch checked={on} onChange={setOn} label="Remind me" />
        </div>
      </div>
    );
  }
  ReactDOM.createRoot(document.getElementById("root")).render(<Demo/>);
</script>
</body></html>
