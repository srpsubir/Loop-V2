<!-- @dsCard group="Components" viewport="700x380" name="People & paper" subtitle="Avatar, Tag, PaperCard, and the signature PersonRow" -->
<!DOCTYPE html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../../styles.css">
<style>
  body{margin:0;background:var(--bg);font-family:var(--font-sans);padding:28px 32px}
  .stack{display:flex;flex-direction:column;gap:22px}
  .row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
  .lbl{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--text-muted);margin-bottom:10px}
</style>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="https://unpkg.com/lucide@0.460.0/dist/umd/lucide.min.js"></script>
<script src="../../_ds_bundle.js"></script>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
  const { Avatar, Tag, PaperCard, PersonRow, IconButton } = window.LoopDesignSystem_96f8bb;
  function Ic({ name, size = 16 }) {
    const ref = React.useRef(null);
    React.useEffect(() => {
      if (ref.current) ref.current.innerHTML = lucide.createElement(lucide[name]).outerHTML;
      const svg = ref.current && ref.current.querySelector("svg");
      if (svg) { svg.setAttribute("width", size); svg.setAttribute("height", size); }
    }, []);
    return <span ref={ref} style={{display:"inline-flex"}} />;
  }
  function Demo(){
    return (
      <div className="stack">
        <div className="row">
          <div><div className="lbl">Avatars</div><div className="row">
            <Avatar name="Priya Raman" />
            <Avatar name="Marcus Bell" ring="sage" />
            <Avatar name="Jo Okafor" ring="terracotta" />
            <Avatar name="Tom Reid" size={36} />
          </div></div>
          <div style={{marginLeft:24}}><div className="lbl">Tags</div><div className="row">
            <Tag tone="chapter">London years</Tag>
            <Tag tone="people">The Camden flat</Tag>
            <Tag tone="positive" icon={<Ic name="Heart" size={12}/>}>Still close</Tag>
            <Tag>Edinburgh</Tag>
          </div></div>
        </div>
        <PaperCard padding={8} style={{maxWidth:520}}>
          <PersonRow name="Priya Raman" note="Last spoke 3 weeks ago · Edinburgh" ring="sage"
            trailing={<IconButton variant="ghost" label="Add note" icon={<Ic name="MessageCircle" size={18}/>} />} />
          <PersonRow name="Marcus Bell" note="It's been a while — since the spring"
            trailing={<IconButton variant="ghost" label="More" icon={<Ic name="Ellipsis" size={18}/>} />} />
        </PaperCard>
      </div>
    );
  }
  ReactDOM.createRoot(document.getElementById("root")).render(<Demo/>);
</script>
</body></html>
