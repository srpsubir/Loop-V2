<!-- @dsCard group="Colors" viewport="700x190" name="Terracotta — primary" subtitle="The warm accent. An ink stamp, used sparingly" -->
<!DOCTYPE html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
  body{margin:0;background:var(--bg);font-family:var(--font-sans);padding:24px}
  .row{display:flex;gap:16px}
  .sw{flex:1;display:flex;flex-direction:column;gap:10px}
  .chip{height:72px;border-radius:var(--radius-md);box-shadow:var(--shadow-sm);display:flex;align-items:flex-end;padding:8px}
  .on{font-size:12px;font-weight:600}
  .meta{display:flex;flex-direction:column;gap:2px}
  .name{font-size:13px;font-weight:600;color:var(--text-primary)}
  .hex{font-size:12px;color:var(--text-muted);font-variant-numeric:tabular-nums}
</style></head>
<body>
  <div class="row">
    <div class="sw"><div class="chip" style="background:var(--terracotta)"><span class="on" style="color:var(--text-on-accent)">Aa</span></div><div class="meta"><span class="name">Terracotta</span><span class="hex">#B8624A</span></div></div>
    <div class="sw"><div class="chip" style="background:var(--accent-hover)"></div><div class="meta"><span class="name">Pressed</span><span class="hex">#A6543E</span></div></div>
    <div class="sw"><div class="chip" style="background:var(--terracotta-light)"></div><div class="meta"><span class="name">Light</span><span class="hex">#D4856E</span></div></div>
    <div class="sw"><div class="chip" style="background:var(--terracotta-faint)"></div><div class="meta"><span class="name">Faint</span><span class="hex">#F5EAD8</span></div></div>
  </div>
</body></html>
