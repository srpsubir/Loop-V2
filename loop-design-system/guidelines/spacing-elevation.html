<!-- @dsCard group="Spacing" viewport="700x200" name="Elevation — warm shadows" subtitle="We lift paper with light, never with borders" -->
<!DOCTYPE html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
  body{margin:0;background:var(--bg);font-family:var(--font-sans);padding:30px 32px}
  .row{display:flex;gap:26px;align-items:center}
  .item{display:flex;flex-direction:column;gap:12px;align-items:center}
  .box{width:96px;height:64px;background:var(--bg);border-radius:var(--radius-md)}
  .n{font-size:12px;font-weight:600;color:var(--text-primary)}
</style></head>
<body>
  <div class="row">
    <div class="item"><div class="box" style="box-shadow:var(--shadow-sm)"></div><span class="n">sm</span></div>
    <div class="item"><div class="box" style="box-shadow:var(--shadow-md)"></div><span class="n">md</span></div>
    <div class="item"><div class="box" style="box-shadow:var(--shadow-lg)"></div><span class="n">lg</span></div>
    <div class="item"><div class="box" style="box-shadow:var(--shadow-xl)"></div><span class="n">xl</span></div>
    <div class="item"><div class="box" style="box-shadow:var(--shadow-inset)"></div><span class="n">inset</span></div>
  </div>
</body></html>
