<!-- @dsCard group="Brand" viewport="700x200" name="Logo" subtitle="Hand-drawn loop mark + Lora wordmark" -->
<!DOCTYPE html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
  body{margin:0;background:var(--bg);font-family:var(--font-serif);padding:28px 32px;display:flex;gap:48px;align-items:center}
  .lockup{display:flex;align-items:center;gap:16px}
  .lockup img{filter:drop-shadow(0 4px 8px rgba(42,31,27,.12))}
  .word{font-size:46px;font-weight:600;color:var(--ink);letter-spacing:-0.02em}
  .onsurface{background:var(--surface-raised);padding:18px 22px;border-radius:var(--radius-lg);box-shadow:var(--shadow-md);display:flex;align-items:center;gap:12px}
  .onsurface .word{font-size:30px}
</style></head>
<body>
  <div class="lockup">
    <img src="../assets/logo/loop-mark.svg" width="76" height="76" alt="Loop mark">
    <span class="word">Loop</span>
  </div>
  <div class="onsurface">
    <img src="../assets/logo/loop-mark.svg" width="40" height="40" alt="Loop mark">
    <span class="word">Loop</span>
  </div>
</body></html>
