<!DOCTYPE html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
  body{margin:0;background:var(--bg);font-family:var(--font-sans);padding:26px 32px;color:var(--text-primary)}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:14px 36px}
  .cell{display:flex;flex-direction:column;gap:5px}
  .yes,.no{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase}
  .yes{color:var(--sage)}
  .no{color:var(--terracotta)}
  .ex{font-size:14px;line-height:1.45}
  .ex.good{color:var(--ink)}
  .ex.bad{color:var(--text-muted);text-decoration:line-through;text-decoration-color:var(--rose)}
</style></head>
<body>
  <div class="grid">
    <div class="cell"><span class="yes">Say this</span><span class="ex good">You haven't spoken to Marcus since the spring.</span></div>
    <div class="cell"><span class="no">Not this</span><span class="ex bad">⚠️ Contact overdue: 84 days since last touchpoint</span></div>
    <div class="cell"><span class="yes">Say this</span><span class="ex good">Everyone from the Camden flat</span></div>
    <div class="cell"><span class="no">Not this</span><span class="ex bad">Group #3 (5 contacts) · Tag: london</span></div>
  </div>
</body></html>
