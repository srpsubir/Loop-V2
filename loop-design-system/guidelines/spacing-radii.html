<!-- @dsCard group="Spacing" viewport="700x180" name="Corner radii" subtitle="Soft corners — paper, gently rounded, never sharp" -->
<!DOCTYPE html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
  body{margin:0;background:var(--bg);font-family:var(--font-sans);padding:24px 32px}
  .row{display:flex;gap:20px;align-items:center}
  .item{display:flex;flex-direction:column;gap:10px;align-items:center}
  .box{width:74px;height:74px;background:var(--surface-raised);box-shadow:var(--shadow-sm)}
  .n{font-size:12px;font-weight:600;color:var(--text-primary)}
  .v{font-size:11px;color:var(--text-muted)}
</style></head>
<body>
  <div class="row">
    <div class="item"><div class="box" style="border-radius:var(--radius-xs)"></div><span class="n">xs</span><span class="v">4px</span></div>
    <div class="item"><div class="box" style="border-radius:var(--radius-sm)"></div><span class="n">sm</span><span class="v">8px</span></div>
    <div class="item"><div class="box" style="border-radius:var(--radius-md)"></div><span class="n">md</span><span class="v">12px</span></div>
    <div class="item"><div class="box" style="border-radius:var(--radius-lg)"></div><span class="n">lg</span><span class="v">18px</span></div>
    <div class="item"><div class="box" style="border-radius:var(--radius-xl)"></div><span class="n">xl</span><span class="v">28px</span></div>
    <div class="item"><div class="box" style="border-radius:var(--radius-full)"></div><span class="n">full</span><span class="v">avatars</span></div>
  </div>
</body></html>
