<!-- @dsCard group="Colors" viewport="700x180" name="Ink & hairlines" subtitle="Text is warm brown, never black. Borders are barely there" -->
<!DOCTYPE html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
  body{margin:0;background:var(--bg);font-family:var(--font-sans);padding:24px;display:flex;gap:32px}
  .col{display:flex;flex-direction:column;gap:14px}
  .ink{display:flex;align-items:center;gap:12px}
  .dot{width:34px;height:34px;border-radius:var(--radius-full);box-shadow:var(--shadow-sm)}
  .lbl{display:flex;flex-direction:column}
  .name{font-size:13px;font-weight:600;color:var(--text-primary)}
  .hex{font-size:12px;color:var(--text-muted);font-variant-numeric:tabular-nums}
  .lines{flex:1;display:flex;flex-direction:column;gap:18px;justify-content:center}
  .ln{display:flex;flex-direction:column;gap:8px}
  .bar{height:0;border-top:1px solid var(--border)}
  .bar.light{border-top:1px solid var(--border-light)}
  .cap{font-size:12px;color:var(--text-muted)}
</style></head>
<body>
  <div class="col">
    <div class="ink"><span class="dot" style="background:var(--ink)"></span><span class="lbl"><span class="name">Ink</span><span class="hex">#2A1F1B</span></span></div>
    <div class="ink"><span class="dot" style="background:var(--ink-mid)"></span><span class="lbl"><span class="name">Ink mid</span><span class="hex">#6B5447</span></span></div>
    <div class="ink"><span class="dot" style="background:var(--ink-muted)"></span><span class="lbl"><span class="name">Ink muted</span><span class="hex">#A38F85</span></span></div>
  </div>
  <div class="lines">
    <div class="ln"><div class="bar"></div><span class="cap">Border · #DDD0C0</span></div>
    <div class="ln"><div class="bar light"></div><span class="cap">Border light · #EDE3D5</span></div>
  </div>
</body></html>
