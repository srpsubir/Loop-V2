<!-- @dsCard group="Colors" viewport="700x180" name="Rose & sage — secondary" subtitle="Dusty rose for people, sage for what's still close" -->
<!DOCTYPE html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
  body{margin:0;background:var(--bg);font-family:var(--font-sans);padding:24px}
  .row{display:flex;gap:16px}
  .sw{flex:1;display:flex;flex-direction:column;gap:10px}
  .chip{height:72px;border-radius:var(--radius-md);box-shadow:var(--shadow-sm)}
  .meta{display:flex;flex-direction:column;gap:2px}
  .name{font-size:13px;font-weight:600;color:var(--text-primary)}
  .hex{font-size:12px;color:var(--text-muted);font-variant-numeric:tabular-nums}
</style></head>
<body>
  <div class="row">
    <div class="sw"><div class="chip" style="background:var(--rose)"></div><div class="meta"><span class="name">Dusty rose</span><span class="hex">#C49A8A</span></div></div>
    <div class="sw"><div class="chip" style="background:var(--rose-faint)"></div><div class="meta"><span class="name">Rose faint</span><span class="hex">#F7EDE8</span></div></div>
    <div class="sw"><div class="chip" style="background:var(--sage)"></div><div class="meta"><span class="name">Sage</span><span class="hex">#6A9470</span></div></div>
    <div class="sw"><div class="chip" style="background:var(--sage-faint)"></div><div class="meta"><span class="name">Sage faint</span><span class="hex">#EAF2EB</span></div></div>
  </div>
</body></html>
