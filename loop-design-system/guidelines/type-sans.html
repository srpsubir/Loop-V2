<!DOCTYPE html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
  body{margin:0;background:var(--bg);font-family:var(--font-sans);padding:28px 32px;color:var(--text-primary)}
  .body{font-size:15px;line-height:1.55;color:var(--ink-mid);max-width:520px;margin:0}
  .label{font-size:13px;font-weight:600;margin:14px 0 0}
  .meta{font-size:12px;color:var(--text-muted);margin:4px 0 0}
  .tag{font-size:11px;color:var(--text-muted);margin-top:14px}
</style></head>
<body>
  <p class="body">You met Priya in the second year, when she moved into the room down the hall. Eleven dinners, three road trips, and one very long phone call later.</p>
  <p class="label">Last spoke</p>
  <p class="meta">3 weeks ago · Edinburgh · added by you</p>
  <p class="tag">Inter · 600 / 500 / 400 · tabular-nums for metadata</p>
</body></html>
