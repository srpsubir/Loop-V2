<!-- @dsCard group="Spacing" viewport="700x150" name="Spacing scale" subtitle="8px rhythm with a 4px half-step — paper breathes" -->
<!DOCTYPE html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
  body{margin:0;background:var(--bg);font-family:var(--font-sans);padding:24px 32px}
  .row{display:flex;gap:14px;align-items:flex-end}
  .item{display:flex;flex-direction:column;gap:8px;align-items:center}
  .box{background:var(--terracotta-light);border-radius:var(--radius-xs)}
  .v{font-size:11px;color:var(--text-muted);font-variant-numeric:tabular-nums}
  .n{font-size:11px;font-weight:600;color:var(--text-primary)}
</style></head>
<body>
  <div class="row" id="r"></div>
  <script>
    const sp=[['1',4],['2',8],['3',12],['4',16],['5',24],['6',32],['7',48],['8',64]];
    document.getElementById('r').innerHTML=sp.map(([n,px])=>
      `<div class="item"><div class="box" style="width:${px}px;height:${px}px"></div><span class="n">${n}</span><span class="v">${px}</span></div>`).join('');
  </script>
</body></html>
