<!-- @dsCard group="Type" viewport="700x250" name="Type scale" subtitle="Display down to micro — serif for headings, sans below" -->
<!DOCTYPE html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
  body{margin:0;background:var(--bg);padding:24px 32px;color:var(--text-primary)}
  .row{display:flex;align-items:baseline;gap:16px;padding:5px 0}
  .spec{font-family:var(--font-sans);font-size:11px;color:var(--text-muted);width:118px;flex:none;font-variant-numeric:tabular-nums}
  .serif{font-family:var(--font-serif)}
  .sans{font-family:var(--font-sans)}
</style></head>
<body>
  <div class="row"><span class="spec">Display · 40 Lora</span><span class="serif" style="font-size:40px;font-weight:600;letter-spacing:-.02em">Edinburgh</span></div>
  <div class="row"><span class="spec">H1 · 30 Lora</span><span class="serif" style="font-size:30px;font-weight:500">Masters crew</span></div>
  <div class="row"><span class="spec">H2 · 22 Lora</span><span class="serif" style="font-size:22px;font-weight:500">Sunday roasts</span></div>
  <div class="row"><span class="spec">H3 · 18 Inter</span><span class="sans" style="font-size:18px;font-weight:600">Priya Raman</span></div>
  <div class="row"><span class="spec">Body · 15 Inter</span><span class="sans" style="font-size:15px">A note about the people you keep.</span></div>
  <div class="row"><span class="spec">Small · 13 Inter</span><span class="sans" style="font-size:13px;color:var(--ink-mid)">Secondary text & controls</span></div>
  <div class="row"><span class="spec">Micro · 11 Inter</span><span class="sans" style="font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--text-muted)">Chapter · 2018</span></div>
</body></html>
