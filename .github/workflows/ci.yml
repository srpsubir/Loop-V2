name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: macos-14

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: TypeScript
        run: npx tsc --noEmit

      - name: Unit tests
        run: npm run test

      - name: Build
        run: npm run build

      - name: Patch Electron plist for tests
        run: |
          /usr/libexec/PlistBuddy \
            -c "Set :CFBundleName Loop" \
            -c "Set :CFBundleDisplayName Loop" \
            -c "Set :CFBundleIdentifier com.loop.dev" \
            node_modules/electron/dist/Electron.app/Contents/Info.plist

      - name: Electron e2e
        run: npm run test:e2e
        env:
          DISPLAY: ''
